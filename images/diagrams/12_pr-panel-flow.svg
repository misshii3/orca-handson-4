<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" role="img" aria-labelledby="t d">
  <title id="t">PR の流れ</title>
  <desc id="d">1 つの PR が左から右へ 5 段階で進む。1 PR を作成（Source Control パネル、コミットメッセージに Closes #N を書く）、2 チェック実行中（GitHub Actions が npm test を実行）、3 チェック成功（PR パネルに緑のチェックが付く）、4 マージ（PR パネルのマージボタン、リポ既定の方式）、5 Issue クローズ（Closes #N により自動で閉じる）。チェック実行中から下に分岐してチェック失敗になることがあり、赤いチップが付いたら Fix broken checks でエージェントに渡し、直して push すると先頭に戻る。下の帯に、main が進むと他の PR に競合が出ることがある（10-4 の注意）と注記。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; fill: #1F2328; }
      .title { font-size: 20px; font-weight: bold; }
      .body { font-size: 13px; }
      .b600 { font-size: 13px; font-weight: 600; }
      .cap { font-size: 12px; fill: #57606A; }
      .cap11 { font-size: 11px; fill: #57606A; }
      .ui { font-size: 12px; font-weight: 600; fill: #57606A; }
      .mid { text-anchor: middle; }
      .box { stroke-width: 1.5; }
      .arrow { fill: none; stroke: #57606A; stroke-width: 1.75; marker-end: url(#arrow); }
      .back { fill: none; stroke: #CF222E; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow-ng); }
    </style>
    <marker id="arrow-ng" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/>
    </marker>
  </defs>

  <!-- 背景カード -->
  <rect x="0.5" y="0.5" width="879" height="391" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>

  <!-- タイトル -->
  <text x="24" y="40" class="title">PR の流れ: 作成 → チェック → マージ → Issue が閉じる</text>
  <text x="24" y="62" class="cap">Orca の PR パネルで見える状態の移り変わり。1 つの PR について、左から右へ進む</text>

  <!-- 1: PR を作成 -->
  <rect x="48" y="94" width="120" height="52" rx="8" fill="#F6F8FA" stroke="#D0D7DE" class="box"/>
  <text x="108" y="124.5" class="b600 mid">PR を作成</text>
  <text x="108" y="168" class="cap mid">コミットメッセージに</text>
  <text x="108" y="184" class="cap mid">Closes #N を書く</text>

  <!-- 2: チェック実行中 -->
  <path d="M168,120 H214" class="arrow"/>
  <rect x="214" y="94" width="120" height="52" rx="8" fill="#FFF8C5" stroke="#BF8700" class="box"/>
  <text x="274" y="124.5" class="b600 mid">チェック実行中</text>
  <text x="274" y="168" class="cap mid">GitHub Actions が</text>
  <text x="274" y="184" class="cap mid">npm test を実行</text>

  <!-- 3: チェック成功 -->
  <path d="M334,120 H380" class="arrow"/>
  <text x="357" y="112" class="cap11 mid">成功</text>
  <rect x="380" y="94" width="120" height="52" rx="8" fill="#DAFBE1" stroke="#1A7F37" class="box"/>
  <text x="440" y="124.5" class="b600 mid" fill="#1A7F37">チェック成功</text>
  <text x="440" y="168" class="cap mid">PR パネルに</text>
  <text x="440" y="184" class="cap mid">緑のチェックが付く</text>

  <!-- 4: マージ -->
  <path d="M500,120 H546" class="arrow"/>
  <rect x="546" y="94" width="120" height="52" rx="8" fill="#FBEFFF" stroke="#8250DF" class="box"/>
  <text x="606" y="124.5" class="b600 mid" fill="#8250DF">マージ</text>
  <text x="606" y="168" class="cap mid">PR パネルのマージボタン</text>
  <text x="606" y="184" class="cap mid">（リポ既定の方式）</text>

  <!-- 5: Issue クローズ -->
  <path d="M666,120 H712" class="arrow"/>
  <rect x="712" y="94" width="120" height="52" rx="8" fill="#DAFBE1" stroke="#1A7F37" class="box"/>
  <text x="772" y="124.5" class="b600 mid" fill="#1A7F37">Issue クローズ</text>
  <text x="772" y="168" class="cap mid">Closes #N により</text>
  <text x="772" y="184" class="cap mid">Issue が自動で閉じる</text>

  <!-- 分岐: チェック失敗 -->
  <path d="M357,120 V248 H380" class="arrow"/>
  <text x="351" y="216" class="cap11" text-anchor="end">失敗</text>
  <rect x="380" y="222" width="120" height="52" rx="8" fill="#FFEBE9" stroke="#CF222E" class="box"/>
  <text x="440" y="252.5" class="b600 mid" fill="#CF222E">チェック失敗</text>
  <text x="512" y="243" class="cap">赤いチップが付く → <tspan class="ui">Fix broken checks</tspan> で</text>
  <text x="512" y="259" class="cap">エージェントに渡す（直させる）</text>

  <!-- 直して push → 先頭に戻る -->
  <path d="M440,274 V300 H28 V120 H48" class="back"/>
  <text x="234" y="294" class="cap mid" fill="#CF222E">直して push（チェックがもう一度走る）</text>

  <!-- 下帯: ポイント -->
  <rect x="24" y="324" width="832" height="44" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
  <text x="40" y="351" class="body" font-weight="600">ポイント:</text>
  <text x="102" y="351" class="body">main が進むと、他の PR に競合が出ることがある（→ 10-4 の注意）。マージしたら、残った PR の状態を見直す</text>
</svg>
