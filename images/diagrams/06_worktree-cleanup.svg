<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" role="img" aria-labelledby="title desc">
  <title id="title">ワークツリー削除で消えるもの・残るもの</title>
  <desc id="desc">ワークツリー fix-tests-claude を「削除 ⌘⇧⌫」すると、フォルダ、未コミットの変更（戻せない）、ローカルブランチが消える。未マージのコミットがあるブランチだけは Preserved branches に退避される。プライマリの main、origin に push 済みのブランチ、PR は残る。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#57606A"/>
    </marker>
  </defs>
  <!-- 背景カード -->
  <rect x="0.5" y="0.5" width="879" height="391" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" fill="#1F2328" font-size="13">
    <text x="24" y="40" font-size="20" font-weight="700">ワークツリーを削除すると、何が消えて何が残るか</text>
    <text x="856" y="40" text-anchor="end" font-size="12" fill="#57606A">削除は取り消せない。残したい変更は先にコミットする</text>

    <!-- 左: 削除前のワークツリー -->
    <rect x="24" y="64" width="328" height="228" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="40" y="89" font-size="15" font-weight="600">ワークツリー <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="500">fix-tests-claude</tspan></text>
    <!-- フォルダ（中立） -->
    <rect x="40" y="104" width="296" height="44" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="52" y="122" font-weight="600">フォルダ</text>
    <text x="52" y="139" font-size="11" fill="#57606A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">~/orca/workspaces/…/fix-tests-claude/</text>
    <!-- 未コミットの変更（警告） -->
    <rect x="40" y="160" width="296" height="44" rx="8" fill="#FFF8C5" stroke="#BF8700" stroke-width="1.5"/>
    <text x="52" y="178" font-weight="600">未コミットの変更</text>
    <text x="52" y="195" font-size="11" fill="#57606A">commit していない編集（今回の Claude の修正）</text>
    <!-- ローカルブランチ（git 色） -->
    <rect x="40" y="216" width="296" height="60" rx="8" fill="#FBEFFF" stroke="#8250DF" stroke-width="1.5"/>
    <text x="52" y="234" font-weight="600">ローカルブランチ</text>
    <text x="52" y="251" font-size="11" fill="#57606A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;ID&gt;/fix-tests-claude</text>
    <text x="52" y="267" font-size="11" fill="#57606A">未マージのコミットを含むことがある</text>

    <!-- 中央: 削除操作と矢印 -->
    <rect x="392" y="68" width="96" height="24" rx="999" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="440" y="85" font-weight="700" text-anchor="middle">削除 ⌘⇧⌫</text>
    <text x="440" y="106" font-size="11" fill="#57606A" text-anchor="middle">サイドバーで右クリック</text>
    <g stroke="#57606A" stroke-width="1.75" marker-end="url(#arrow)">
      <line x1="360" y1="126" x2="518" y2="126"/>
      <line x1="360" y1="182" x2="518" y2="182"/>
      <line x1="360" y1="246" x2="518" y2="246"/>
    </g>

    <!-- 右: 削除後 -->
    <rect x="528" y="64" width="328" height="228" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
    <text x="544" y="89" font-size="15" font-weight="600">削除後</text>
    <rect x="544" y="104" width="296" height="44" rx="8" fill="#FFEBE9" stroke="#CF222E" stroke-width="1.5"/>
    <text x="556" y="122" font-weight="600">フォルダ → 消える</text>
    <text x="556" y="139" font-size="11" fill="#57606A">ディスクから削除される</text>
    <rect x="544" y="160" width="296" height="44" rx="8" fill="#FFEBE9" stroke="#CF222E" stroke-width="1.5"/>
    <text x="556" y="178" font-weight="600">未コミットの変更 → <tspan fill="#CF222E">消える（戻せない）</tspan></text>
    <text x="556" y="195" font-size="11" fill="#57606A">残したい変更は削除前にコミットする</text>
    <rect x="544" y="216" width="296" height="60" rx="8" fill="#FFEBE9" stroke="#CF222E" stroke-width="1.5"/>
    <text x="556" y="234" font-weight="600">ローカルブランチ → 消える</text>
    <text x="556" y="251" font-size="11" fill="#57606A">未マージのコミットがあれば</text>
    <text x="556" y="267" font-size="11" fill="#57606A">「<tspan fill="#8250DF" font-weight="700">Preserved branches</tspan>」に退避される</text>

    <!-- 下帯: 残るもの（成功色） -->
    <rect x="24" y="312" width="832" height="56" rx="12" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.5"/>
    <text x="40" y="345" font-size="15" font-weight="600" fill="#1A7F37">残るもの</text>
    <g stroke="#1A7F37" stroke-width="1.5" fill="#FFFFFF">
      <rect x="136" y="327" width="132" height="26" rx="999"/>
      <rect x="284" y="327" width="220" height="26" rx="999"/>
      <rect x="520" y="327" width="56" height="26" rx="999"/>
    </g>
    <g text-anchor="middle">
      <text x="202" y="345">プライマリ <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">main</tspan></text>
      <text x="394" y="345">origin に push 済みのブランチ</text>
      <text x="548" y="345">PR</text>
    </g>
    <text x="592" y="345" font-size="12" fill="#57606A">＝ 採用した側と main には影響なし</text>
  </g>
</svg>
